<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=__WIDTH__,height=__HEIGHT__,initial-scale=1">
<title>RepoTunnel Video Scene</title>
<style>
:root{
  --accent:__ACCENT__;
  --accent2:__ACCENT2__;
  --bg0:#070b14;
  --bg1:#0d1628;
  --text:#f6f8fb;
  --muted:#b8c4d6;
  --safe:__SAFE__px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,"DejaVu Sans",Arial,sans-serif}
body{width:__WIDTH__px;height:__HEIGHT__px}
#stage{
  position:relative;width:__WIDTH__px;height:__HEIGHT__px;overflow:hidden;
  color:var(--text);
  background:
    radial-gradient(circle at 18% 16%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 34%),
    radial-gradient(circle at 82% 76%,color-mix(in srgb,var(--accent2) 24%,transparent),transparent 38%),
    linear-gradient(135deg,var(--bg0),var(--bg1) 58%,#101b2d);
  transform-origin:center;
}
.playful-bright{
  --bg0:#fff7ed;--bg1:#eef2ff;--text:#111827;--muted:#475569;
}
.playful-bright .bg-grid{
  background-image:
    linear-gradient(rgba(15,23,42,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,23,42,.09) 1px,transparent 1px);
}
.playful-bright .card,.playful-bright .flow-node{
  background:rgba(255,255,255,.78);border-color:color-mix(in srgb,var(--accent) 38%,rgba(15,23,42,.12));
  box-shadow:0 22px 65px rgba(71,85,105,.18),inset 0 1px 0 rgba(255,255,255,.9);
}
.bg-grid{
  position:absolute;inset:-8%;opacity:.17;
  background-image:
    linear-gradient(rgba(255,255,255,.11) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.11) 1px,transparent 1px);
  background-size:54px 54px;
  transform:rotate(-2deg) scale(1.08);
}
.orb{position:absolute;border-radius:999px;filter:blur(2px);opacity:.24}
.orb.a{width:540px;height:540px;left:-170px;top:85px;background:var(--accent)}
.orb.b{width:620px;height:620px;right:-210px;bottom:-140px;background:var(--accent2)}
.safe{
  position:absolute;left:var(--safe);top:var(--safe);right:var(--safe);bottom:var(--safe);
  display:flex;align-items:center;justify-content:center;
}
.main-content{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:34px;position:relative;
}
.layout-2 .main-content{align-items:flex-start}
.layout-3 .main-content{justify-content:space-between}
.kicker{font-size:36px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.title{
  margin:0;max-width:1540px;font-size:82px;line-height:1.05;font-weight:850;text-align:center;
  letter-spacing:-.035em;text-wrap:balance;
}
.layout-2 .title{text-align:left}
.subtitle{
  margin:0;max-width:1380px;font-size:42px;line-height:1.3;font-weight:500;text-align:center;color:var(--muted);
  text-wrap:balance;
}
.layout-2 .subtitle{text-align:left}
.grid{
  width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px;align-items:stretch;
}
.bullet-list{
  width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;
}
.bullet{
  min-height:138px;padding:28px 34px;border-radius:26px;
  display:flex;align-items:center;gap:24px;
  background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.14);
}
.bullet-dot{
  width:22px;height:22px;min-width:22px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 14%,transparent);
}
.bullet-text{font-size:40px;line-height:1.25;font-weight:650;color:var(--text)}
.playful-bright .bullet{background:rgba(255,255,255,.8);border-color:rgba(15,23,42,.10)}
.type-line{display:block;white-space:pre-wrap;overflow:hidden}
.card{
  min-height:250px;border:1px solid color-mix(in srgb,var(--accent) 38%,rgba(255,255,255,.16));
  background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
  border-radius:30px;box-shadow:0 24px 80px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);
  padding:34px;
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.card-content{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.card h3{margin:0;font-size:44px;line-height:1.08}
.card p{margin:0;font-size:40px;line-height:1.25;color:var(--muted);text-wrap:balance}
.badge{font-size:36px;font-weight:800;color:var(--accent)}
.flow{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.flow-node{
  flex:1;min-width:0;min-height:250px;padding:30px;border-radius:30px;
  background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;
}
.flow-node h3{font-size:42px;margin:0}
.flow-node p{font-size:40px;line-height:1.24;margin:0;color:var(--muted)}
.arrow{
  width:110px;min-width:110px;height:24px;position:relative;
}
.arrow::before{
  content:"";position:absolute;left:0;right:20px;top:10px;height:4px;border-radius:8px;background:var(--accent);
}
.arrow::after{
  content:"";position:absolute;right:0;top:3px;width:18px;height:18px;border-top:4px solid var(--accent);
  border-right:4px solid var(--accent);transform:rotate(45deg);
}
.code-shell,.terminal-shell{
  width:100%;min-height:620px;border-radius:32px;overflow:hidden;border:1px solid rgba(255,255,255,.15);
  background:#080d16;box-shadow:0 26px 90px rgba(0,0,0,.35);
}
.shell-bar{height:70px;display:flex;align-items:center;gap:13px;padding:0 28px;background:#111a29;border-bottom:1px solid rgba(255,255,255,.1)}
.dot{width:18px;height:18px;border-radius:50%;background:var(--accent)}
pre{
  margin:0;padding:44px 52px;font:600 40px/1.45 "DejaVu Sans Mono",monospace;color:#eaf2ff;white-space:pre-wrap;
}
.compare{
  width:100%;display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:stretch;
}
.compare .card{min-height:560px}
.stat-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
.stat{min-height:270px}
.stat .value{font-size:92px;font-weight:900;line-height:1;color:var(--accent)}
.chart-bars{
  width:100%;height:280px;display:flex;align-items:flex-end;justify-content:space-around;gap:36px;
  padding:0 60px 10px;border-bottom:4px solid color-mix(in srgb,var(--muted) 45%,transparent);
}
.chart-bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px}
.chart-bar{width:min(140px,65%);height:var(--bar-height);min-height:54px;border-radius:24px 24px 8px 8px;background:linear-gradient(180deg,var(--accent),var(--accent2));box-shadow:0 14px 45px color-mix(in srgb,var(--accent) 30%,transparent);transform-origin:50% 100%}
.chart-label{font-size:36px;font-weight:750;text-align:center}
.quote{
  max-width:1500px;font-size:64px;line-height:1.18;font-weight:760;text-align:center;text-wrap:balance;
}
.quote-mark{font-size:140px;line-height:.6;color:var(--accent)}
.speaker{font-size:38px;color:var(--muted);font-weight:650}
.lower-third{
  width:100%;margin-top:auto;padding:42px 54px;border-radius:28px;background:rgba(8,13,22,.78);
  border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;gap:30px;
}
.lower-third strong{font-size:48px}.lower-third span{font-size:36px;color:var(--muted)}
.hero-ring{
  width:430px;height:430px;border-radius:50%;border:4px solid color-mix(in srgb,var(--accent) 70%,white 12%);
  box-shadow:0 0 0 30px color-mix(in srgb,var(--accent) 12%,transparent),0 0 120px color-mix(in srgb,var(--accent) 35%,transparent);
  display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:var(--accent);
}
.git-graph{width:100%;min-height:560px;position:relative;display:flex;align-items:center;justify-content:center}
.git-track{position:absolute;left:8%;right:8%;top:50%;height:8px;border-radius:8px;background:rgba(255,255,255,.18)}
.git-branch{position:absolute;left:34%;width:34%;top:29%;height:170px;border:8px solid var(--accent);border-left:0;border-bottom:0;border-radius:0 90px 0 0}
.git-nodes{width:84%;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.git-node{width:70px;height:70px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 16px rgba(255,255,255,.08),0 0 40px color-mix(in srgb,var(--accent) 45%,transparent)}
.git-labels{position:absolute;left:8%;right:8%;top:62%;display:flex;justify-content:space-between}
.git-labels span{font-size:36px;font-weight:700}
.transition{
  position:absolute;inset:-1px;z-index:50;pointer-events:none;background:#070b14;opacity:1;
}
.pulse{
  position:absolute;width:110px;height:110px;border:4px solid var(--accent);border-radius:50%;opacity:.7;pointer-events:none;
}
.autofix .main-content{gap:24px}
.autofix .grid{gap:24px}
.autofix .card{padding:28px}
.autofix .title{max-width:1600px}
.autofix .subtitle{max-width:1480px}
</style>
</head>
<body>
<div id="stage" class="__THEME_CLASS__ __LAYOUT_CLASS__">
  <div class="bg-grid"></div><div class="orb a"></div><div class="orb b"></div>
  <div class="safe"><main class="main-content" data-qa-main>__BODY__</main></div>
  <div class="transition"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(() => {
  const DURATION = __DURATION__;
  window.__repotunnelDuration = DURATION;
  const TRANSITION = "__TRANSITION__";
  const SAFE = __SAFE__;
  const MIN_FONT = {title:72,body:40,label:36,caption:44,code:40};
  function rectOverlap(a,b){return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top}
  function visibleRect(el){const r=el.getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}}
  window.__repotunnelQa = () => {
    const issues=[];
    const stage=visibleRect(document.getElementById("stage"));
    const qaEls=[...document.querySelectorAll("[data-qa]")].filter((el)=>getComputedStyle(el).visibility!=="hidden"&&getComputedStyle(el).display!=="none");
    const qaRects=qaEls.map(visibleRect).filter((r)=>r.width>1&&r.height>1);
    const union=qaRects.length?qaRects.reduce((a,r)=>({
      left:Math.min(a.left,r.left),top:Math.min(a.top,r.top),
      right:Math.max(a.right,r.right),bottom:Math.max(a.bottom,r.bottom),
      width:0,height:0
    }),{left:stage.width,top:stage.height,right:0,bottom:0,width:0,height:0}):{left:0,top:0,right:0,bottom:0};
    const coverage=qaRects.length?((union.right-union.left)*(union.bottom-union.top))/(stage.width*stage.height):0;
    if(coverage<0.60) issues.push({code:"contentCoverage",message:`Visible content fills only ${(coverage*100).toFixed(1)}% of frame; minimum is 60%.`});
    const textEls=[...document.querySelectorAll("[data-qa-text]")];
    for(const el of document.querySelectorAll("[data-qa],[data-qa-text]")){
      const r=visibleRect(el);
      if(r.left<SAFE-1||r.top<SAFE-1||r.right>stage.width-SAFE+1||r.bottom>stage.height-SAFE+1){
        issues.push({code:"safeArea",message:"Element extends outside 120px safe area."});
      }
      if(el.scrollWidth>el.clientWidth+2||el.scrollHeight>el.clientHeight+2){
        issues.push({code:"clipped",message:"Element content is clipped."});
      }
    }
    for(const el of textEls){
      const kind=el.dataset.kind||"body";
      const min=MIN_FONT[kind]||MIN_FONT.body;
      const px=parseFloat(getComputedStyle(el).fontSize||"0");
      if(px+0.1<min) issues.push({code:"fontSize",message:`${kind} font is ${px}px; minimum is ${min}px.`});
    }
    for(let i=0;i<textEls.length;i++){
      const a=visibleRect(textEls[i]);
      for(let j=i+1;j<textEls.length;j++){
        if(textEls[i].contains(textEls[j])||textEls[j].contains(textEls[i])) continue;
        const b=visibleRect(textEls[j]);
        if(rectOverlap(a,b)) issues.push({code:"textOverlap",message:"Text elements overlap."});
      }
    }
    for(const box of document.querySelectorAll(".card,.flow-node")){
      const style=getComputedStyle(box);
      const br=visibleRect(box);
      const children=[...box.querySelectorAll("[data-qa-text]")].map(visibleRect);
      if(style.alignItems!=="center"||style.justifyContent!=="center"){
        issues.push({code:"centering",message:"Card content is not centered by layout."});
      }
      if(children.length){
        const cr=children.reduce((a,r)=>({left:Math.min(a.left,r.left),top:Math.min(a.top,r.top),right:Math.max(a.right,r.right),bottom:Math.max(a.bottom,r.bottom)}));
        const dx=Math.abs((cr.left+cr.right)/2-(br.left+br.right)/2);
        const dy=Math.abs((cr.top+cr.bottom)/2-(br.top+br.bottom)/2);
        if(dx>Math.max(18,br.width*.08)||dy>Math.max(18,br.height*.10)){
          issues.push({code:"centering",message:"Card text is visibly off-center inside its container."});
        }
      }
    }
    return {passed:issues.length===0,coverageRatio:coverage,issues};
  };
  window.__repotunnelAutoFix = () => {
    document.getElementById("stage").classList.add("autofix");
    const before=window.__repotunnelQa();
    if(before.coverageRatio<0.60){
      document.querySelector("[data-qa-main]").style.justifyContent="space-between";
    }
    document.querySelectorAll("[data-qa-text]").forEach((el)=>{
      el.style.overflowWrap="anywhere";
      el.style.maxWidth="100%";
    });
    return window.__repotunnelQa();
  };
  function makeTimeline(){
    const tl=gsap.timeline({paused:true});
    const stage=document.getElementById("stage");
    const playful=stage.classList.contains("playful-bright");
    const entryEase=playful?"back.out(1.7)":"power3.out";
    gsap.set(".reveal",{opacity:0,y:56});
    gsap.set(".card,.flow-node",{transformOrigin:"50% 50%"});
    gsap.set(".transition",{xPercent:0,opacity:1});
    tl.to(".transition",{opacity:0,duration:.42,ease:"power3.out"},0);
    tl.fromTo("#stage",{x:120,scale:.985},{x:0,scale:1,duration:.55,ease:entryEase},0);
    tl.to(".bg-grid",{x:38,y:-24,duration:DURATION,ease:"none"},0);
    tl.to(".orb.a",{x:100,y:46,duration:DURATION,ease:"none"},0);
    tl.to(".orb.b",{x:-120,y:-54,duration:DURATION,ease:"none"},0);
    tl.to("#stage",{scale:1.035,x:-10,y:-6,duration:Math.max(.2,DURATION-.56),ease:"none"},.56);
    tl.to(".reveal",{opacity:1,y:0,duration:.68,ease:"power3.out",stagger:.12},.08);
    tl.from(".card,.flow-node",{scale:.88,opacity:0,duration:.62,ease:playful?"back.out(1.9)":"power3.out",stagger:.12},.18);
    tl.from(".arrow",{scaleX:0,transformOrigin:"0 50%",duration:.6,ease:"power3.out",stagger:.12},.45);
    tl.from(".git-node",{scale:0,opacity:0,duration:.48,ease:"back.out(1.8)",stagger:.12},.28);
    tl.from(".git-branch",{opacity:0,scaleX:.2,transformOrigin:"0 0",duration:.72,ease:"power3.out"},.65);
    tl.from(".git-label",{opacity:0,y:20,duration:.38,ease:"power3.out",stagger:.12},.82);
    tl.from(".type-line",{opacity:0,clipPath:"inset(0 100% 0 0)",duration:.42,ease:"power3.out",stagger:.12},.32);
    tl.from(".chart-bar",{scaleY:0,duration:.72,ease:"power3.out",stagger:.12},.35);
    tl.fromTo(".hero-ring",{scale:.92},{scale:1.03,duration:.8,ease:"power3.out",yoyo:true,repeat:Math.max(1,Math.floor(DURATION/1.4))},.7);
    tl.to(".card:first-child,.flow-node:first-child,.git-node:nth-child(2)",{
      filter:"drop-shadow(0 0 22px var(--accent))",scale:1.025,duration:.7,ease:"power3.out",
      yoyo:true,repeat:Math.max(1,Math.floor(DURATION/1.5))
    },.9);
    const end=Math.max(.2,DURATION-.55);
    if(TRANSITION==="zoom"){
      tl.to("#stage",{scale:1.12,duration:.52,ease:"power3.in"},end);
      tl.to(".transition",{opacity:1,duration:.42,ease:"power3.in"},end+.10);
    }else if(TRANSITION==="wipe"){
      tl.set(".transition",{xPercent:-105,opacity:1},end);
      tl.to(".transition",{xPercent:0,duration:.55,ease:"power3.inOut"},end);
    }else{
      tl.to("#stage",{x:-180,duration:.52,ease:"power3.in"},end);
      tl.to(".transition",{opacity:1,duration:.42,ease:"power3.in"},end+.10);
    }
    return tl;
  }
  function boot(){
    if(!window.gsap){setTimeout(boot,50);return}
    const tl=makeTimeline();
    window.__repotunnelSeek=(seconds)=>{
      const t=Math.max(0,Math.min(DURATION,Number(seconds)||0));
      tl.pause(t,false);
      return new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    };
    window.__repotunnelTimeline=tl;
    window.__repotunnelReady=true;
  }
  boot();
})();
</script>
</body>
</html>

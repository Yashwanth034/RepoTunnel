name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed RepoTunnel releases." >&2
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required for RepoTunnel's password-protected updater key." >&2
            exit 1
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Verify tag and version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "${GITHUB_REF_NAME}" in
            "v${VERSION}"|"v${VERSION}-retry"*) ;;
            *)
              echo "Tag ${GITHUB_REF_NAME} does not match RepoTunnel v${VERSION}." >&2
              exit 1
              ;;
          esac

      - name: Verify release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageVersion = require('./package.json').version;
          const packageLockVersion = require('./package-lock.json').version;
          const tauriVersion = require('./src-tauri/tauri.conf.json').version;
          const cargoToml = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const cargoLock = fs.readFileSync('./src-tauri/Cargo.lock', 'utf8');
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1];
          const cargoLockVersion = cargoLock.match(/\[\[package\]\]\nname = "repotunnel"\nversion = "([^"]+)"/)?.[1];
          const versions = { packageVersion, packageLockVersion, tauriVersion, cargoVersion, cargoLockVersion };
          if (Object.values(versions).some((value) => !value) || new Set(Object.values(versions)).size !== 1) {
            console.error('Release version mismatch:', versions);
            process.exit(1);
          }
          NODE
          if find src-tauri/src -type f -name '*.before-*' -print -quit | grep -q .; then
            echo "Stale .before-* source files are present." >&2
            exit 1
          fi

      - name: Frontend typecheck
        run: npm run check

      - name: Frontend tests
        run: npm run test:frontend

      - name: Frontend production build
        run: npm run build

      - name: npm dependency audit
        run: npm audit --audit-level=moderate

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust Clippy (warnings are errors)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: RustSec dependency audit
        run: cargo audit --no-yanked --file src-tauri/Cargo.lock

  linux:
    name: Linux x64
    needs: quality
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/usr/src/repotunnel-build
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build signed release packages
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles deb,rpm,appimage 2>&1 | tee tauri-release-build.log
          if grep -Fq 'does not match the public key' tauri-release-build.log; then
            echo "Updater signing key does not match the public key compiled into RepoTunnel." >&2
            exit 1
          fi

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p platform-artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.sig' -o -name '*.tar.gz' \) \
            -exec cp {} platform-artifacts/ \;
          test "$(find platform-artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | wc -l)" -ge 3
          test "$(find platform-artifacts -type f -name '*.sig' | wc -l)" -ge 3
          ls -lh platform-artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: RepoTunnel-linux-x64
          path: platform-artifacts/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $entry = Get-Content "src-tauri/src/main.rs" -Raw
          if (-not $entry.Contains('windows_subsystem = "windows"')) {
            throw "Windows release builds must use the GUI subsystem."
          }

      - name: Windows Rust Clippy
        shell: cmd
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format short -- -D warnings

      - name: Windows Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build signed installers
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/usr/src/repotunnel-build
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis,msi 2>&1 | Tee-Object -FilePath tauri-release-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path tauri-release-build.log -SimpleMatch 'does not match the public key') {
            throw "Updater signing key does not match the public key compiled into RepoTunnel."
          }

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path platform-artifacts | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe', '.sig' -or $_.Name.EndsWith('.zip') } |
            Copy-Item -Destination platform-artifacts
          if ((Get-ChildItem platform-artifacts -File | Where-Object { $_.Extension -in '.msi', '.exe' }).Count -lt 2) {
            throw "Expected NSIS and MSI installers."
          }
          if ((Get-ChildItem platform-artifacts -File -Filter '*.sig').Count -lt 2) {
            throw "Expected signed Windows updater artifacts."
          }
          Get-ChildItem platform-artifacts

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: RepoTunnel-windows-x64
          path: platform-artifacts/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            file_arch: aarch64
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            file_arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_SIGNING_IDENTITY: "-"
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/usr/src/repotunnel-build
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: macOS Rust Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format short -- -D warnings 2>&1 | tee macos-clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            first="$(grep -m1 -E 'warning(:|\[)|error(:|\[)' macos-clippy.log || true)"
            if [ -n "$first" ]; then
              echo "::error title=macOS Rust Clippy::$first"
            fi
            {
              echo "### macOS Rust Clippy failure"
              echo '```text'
              tail -80 macos-clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: macOS Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build signed app and DMG
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles app,dmg 2>&1 | tee tauri-release-build.log
          if grep -Fq 'does not match the public key' tauri-release-build.log; then
            echo "Updater signing key does not match the public key compiled into RepoTunnel." >&2
            exit 1
          fi

      - name: Verify and collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG_PATH="$(find "$BUNDLE_ROOT" -type f -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          test -s "$DMG_PATH"
          hdiutil verify "$DMG_PATH" >/dev/null

          MOUNT_DIR="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true
            rm -rf "$MOUNT_DIR"
          }
          trap cleanup EXIT
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_DIR" >/dev/null
          APP_PATH="$(find "$MOUNT_DIR" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          test -n "$EXECUTABLE"
          test -x "$APP_PATH/Contents/MacOS/$EXECUTABLE"
          cleanup
          trap - EXIT

          VERSION="$(node -p "require('./package.json').version")"
          UPDATER_PATH="$(find "$BUNDLE_ROOT" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$UPDATER_PATH"
          test -s "$UPDATER_PATH"
          test -s "$UPDATER_PATH.sig"
          mkdir -p platform-artifacts
          cp "$DMG_PATH" "platform-artifacts/RepoTunnel_${VERSION}_${{ matrix.file_arch }}.dmg"
          cp "$UPDATER_PATH" "platform-artifacts/RepoTunnel_${VERSION}_${{ matrix.file_arch }}.app.tar.gz"
          cp "$UPDATER_PATH.sig" "platform-artifacts/RepoTunnel_${VERSION}_${{ matrix.file_arch }}.app.tar.gz.sig"
          ls -lh platform-artifacts

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RepoTunnel-macos-${{ matrix.file_arch }}
          path: platform-artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f -exec cp {} release-files/ \;
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -ge 14
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v${VERSION}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { capture=1; next }
            /^## / && capture { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          node scripts/generate-updater-manifest.mjs \
            release-files "$RELEASE_TAG" "$GITHUB_REPOSITORY" release-notes.md
          test -s release-files/latest.json
          (
            cd release-files
            sha256sum * > RepoTunnel-SHA256SUMS.txt
          )
          ls -lh release-files

      - name: Point final release tag at verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" release-files/* \
            --verify-tag \
            --title "RepoTunnel ${RELEASE_TAG}" \
            --notes-file release-notes.md

      - name: Remove successful retry tag
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${GITHUB_REF_NAME}" \
              >/dev/null || echo "Release succeeded; retry-tag cleanup can be done later."
          fi

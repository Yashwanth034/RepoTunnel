name: Platform Build Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/usr/src/repotunnel-build

    steps:
      - name: Checkout audited v0.1.0 source
        uses: actions/checkout@v7
        with:
          ref: 7cf04a91231fb69796fb8067972069317c0ed3de

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: Collect Windows installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path platform-artifacts | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination platform-artifacts
          Get-ChildItem platform-artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RepoTunnel-v0.1.0-windows-x64
          path: platform-artifacts/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple-Silicon
            target: aarch64-apple-darwin
          - name: Intel
            target: x86_64-apple-darwin

    env:
      APPLE_SIGNING_IDENTITY: "-"
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/usr/src/repotunnel-build

    steps:
      - name: Checkout audited v0.1.0 source
        uses: actions/checkout@v7
        with:
          ref: 7cf04a91231fb69796fb8067972069317c0ed3de

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build macOS DMG
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg

      - name: Collect macOS DMG
        run: |
          mkdir -p platform-artifacts
          find src-tauri/target -type f -name '*.dmg' -exec cp {} platform-artifacts/ \;
          ls -lh platform-artifacts

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoTunnel-v0.1.0-macos-${{ matrix.target }}
          path: platform-artifacts/*.dmg
          if-no-files-found: error

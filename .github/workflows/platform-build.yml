name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Verify tag and version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "${GITHUB_REF_NAME}" in
            "v${VERSION}"|"v${VERSION}-retry"*) ;;
            *)
              echo "Tag ${GITHUB_REF_NAME} does not match RepoTunnel v${VERSION}." >&2
              exit 1
              ;;
          esac

      - name: Verify release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageVersion = require('./package.json').version;
          const packageLockVersion = require('./package-lock.json').version;
          const tauriVersion = require('./src-tauri/tauri.conf.json').version;
          const cargoToml = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const cargoLock = fs.readFileSync('./src-tauri/Cargo.lock', 'utf8');
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1];
          const cargoLockVersion = cargoLock.match(/\[\[package\]\]\nname = "repotunnel"\nversion = "([^"]+)"/)?.[1];
          const versions = { packageVersion, packageLockVersion, tauriVersion, cargoVersion, cargoLockVersion };
          if (Object.values(versions).some((value) => !value) || new Set(Object.values(versions)).size !== 1) {
            console.error('Release version mismatch:', versions);
            process.exit(1);
          }
          NODE
          if find src-tauri/src -type f -name '*.before-*' -print -quit | grep -q .; then
            echo "Stale .before-* source files are present." >&2
            exit 1
          fi

      - name: Frontend typecheck
        run: npm run check

      - name: Frontend tests
        run: npm run test:frontend

      - name: Frontend production build
        run: npm run build

      - name: npm dependency audit
        run: npm audit --audit-level=moderate

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust Clippy (warnings are errors)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: RustSec dependency audit
        run: cargo audit --no-yanked --file src-tauri/Cargo.lock

  linux:
    name: Linux x64
    needs: quality
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/usr/src/repotunnel-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run tauri -- build --bundles deb,rpm,appimage

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p platform-artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} platform-artifacts/ \;
          test "$(find platform-artifacts -type f | wc -l)" -ge 3
          ls -lh platform-artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: RepoTunnel-linux-x64
          path: platform-artifacts/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $entry = Get-Content "src-tauri/src/main.rs" -Raw
          if (-not $entry.Contains('windows_subsystem = "windows"')) {
            throw "Windows release builds must use the GUI subsystem."
          }

      - name: Windows Rust Clippy
        id: windows_clippy
        continue-on-error: true
        shell: cmd
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format short -- -D warnings > windows-clippy.log 2>&1

      - name: Report Windows Rust Clippy failure
        if: steps.windows_clippy.outcome == 'failure'
        shell: pwsh
        run: |
          $log = "windows-clippy.log"
          if (-not (Test-Path $log)) {
            Write-Output "::error title=Windows Rust Clippy::Clippy failed before producing its diagnostic log."
            exit 1
          }
          $lines = Get-Content $log
          $lines | ForEach-Object { Write-Output $_ }
          $diagnostics = $lines | Select-String -Pattern 'warning(:|\[)|error(:|\[)' | Select-Object -First 50
          $annotated = 0
          if ($diagnostics) {
            foreach ($diagnostic in $diagnostics) {
              $raw = $diagnostic.Line
              $match = [regex]::Match($raw, '^(?<path>.+?\.rs):(?<line>\d+):(?<col>\d+):\s+(?<level>warning|error)(?:\[[^\]]+\])?:\s+(?<message>.*)$')
              if ($match.Success) {
                $path = $match.Groups['path'].Value.Replace([char]92, [char]47).Replace('%', '%25').Replace(',', '%2C').Replace(':', '%3A')
                $line = $match.Groups['line'].Value
                $col = $match.Groups['col'].Value
                $message = $match.Groups['message'].Value.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error file=$path,line=$line,col=$col,title=Windows Rust Clippy::$message"
                $annotated++
              } else {
                $message = $raw.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Windows Rust Clippy::$message"
              }
            }
          }
          if ($annotated -eq 0) {
            $first = $lines | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -First 1
            if (-not $first) { $first = 'Windows Clippy failed without diagnostic output.' }
            $message = $first.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Rust Clippy diagnostic::$message"
          }
          "### Windows Rust Clippy failure" | Add-Content $env:GITHUB_STEP_SUMMARY
          "```text" | Add-Content $env:GITHUB_STEP_SUMMARY
          $lines | Select-Object -Last 160 | Add-Content $env:GITHUB_STEP_SUMMARY
          "```" | Add-Content $env:GITHUB_STEP_SUMMARY
          exit 1

      - name: Windows Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installers
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/usr/src/repotunnel-build
        run: npm run tauri -- build --bundles nsis,msi

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path platform-artifacts | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination platform-artifacts
          if ((Get-ChildItem platform-artifacts -File).Count -lt 2) {
            throw "Expected NSIS and MSI installers."
          }
          Get-ChildItem platform-artifacts

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: RepoTunnel-windows-x64
          path: platform-artifacts/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            file_arch: aarch64
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            file_arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_SIGNING_IDENTITY: "-"
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/usr/src/repotunnel-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: macOS Rust Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format short -- -D warnings 2>&1 | tee macos-clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            first="$(grep -m1 -E 'warning(:|\[)|error(:|\[)' macos-clippy.log || true)"
            if [ -n "$first" ]; then
              echo "::error title=macOS Rust Clippy::$first"
            fi
            {
              echo "### macOS Rust Clippy failure"
              echo '```text'
              tail -80 macos-clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: macOS Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build DMG
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles dmg

      - name: Verify and collect DMG
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG_PATH="$(find "$BUNDLE_ROOT" -type f -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          test -s "$DMG_PATH"
          hdiutil verify "$DMG_PATH" >/dev/null

          MOUNT_DIR="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true
            rm -rf "$MOUNT_DIR"
          }
          trap cleanup EXIT
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_DIR" >/dev/null
          APP_PATH="$(find "$MOUNT_DIR" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          test -n "$EXECUTABLE"
          test -x "$APP_PATH/Contents/MacOS/$EXECUTABLE"
          cleanup
          trap - EXIT

          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p platform-artifacts
          cp "$DMG_PATH" "platform-artifacts/RepoTunnel_${VERSION}_${{ matrix.file_arch }}.dmg"
          ls -lh platform-artifacts

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: RepoTunnel-macos-${{ matrix.file_arch }}
          path: platform-artifacts/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f -exec cp {} release-files/ \;
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -ge 7
          (
            cd release-files
            sha256sum * > RepoTunnel-SHA256SUMS.txt
          )
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v${VERSION}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { capture=1; next }
            /^## / && capture { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          ls -lh release-files

      - name: Point final release tag at verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" release-files/* \
            --verify-tag \
            --title "RepoTunnel ${RELEASE_TAG}" \
            --notes-file release-notes.md

      - name: Remove successful retry tag
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${GITHUB_REF_NAME}" \
              >/dev/null || echo "Release succeeded; retry-tag cleanup can be done later."
          fi
